    <div id="root"></div>
    <script>
      window.__relatoriosInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        window.__relatoriosInstallPrompt = event;
        window.dispatchEvent(new CustomEvent('relatorios:install-prompt-ready'));
      });
      window.addEventListener('appinstalled', () => {
        window.__relatoriosInstallPrompt = null;
      });
